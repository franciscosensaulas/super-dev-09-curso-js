<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Categorias</title>
    <link rel="stylesheet" href="assets/css/exemplo-06-crud.css">
</head>
<body>

    <main class="container">
        <h1>Cadastro de Categorias</h1>

        <section class="card">
            <h2>Nova Categoria</h2>

            <form>
                <div class="campo">
                    <label for="campo-nome">Nome da categoria</label>
                    <input 
                        type="text" 
                        id="campo-nome" 
                        placeholder="Digite o nome da categoria"
                        required
                    >
                </div>

                <button type="submit" class="botao-salvar">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar
                </button>
            </form>
        </section>

        <section class="card">
            <h2>Lista de Categorias</h2>

            <table id="tabela-categorias">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="categorias">
                    
                </tbody>
            </table>
        </section>
    </main>
    <script src="https://kit.fontawesome.com/1e9e613c9b.js" crossorigin="anonymous"></script>
    <script src="assets/js/exemplo-06-crud.js"></script>
</body>
</html>
